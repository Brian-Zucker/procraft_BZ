
name: Test APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: |
          cargo install --locked --version 4.1.2 cargo-ndk
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Set up Android SDK
  uses: android-actions/setup-android@v4
  with:
    packages: 'platform-tools'
    
      - name: Install Android NDK
        run: |
          sdkmanager --install "platforms;android-37" "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK (ARM64 only)
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug -Pprocraft.abis=arm64-v8a

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ProCraft-HC16-Test
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
